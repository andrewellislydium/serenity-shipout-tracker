# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - serenity-tracker-994ac2

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      # Build here, then keep only runtime packages, so App Service has nothing to
      # rebuild or unpack at startup. Pair with the app setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT=false.
      - name: npm ci, build, prune dev dependencies
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Zip release
        run: zip -qr release.zip dist public assets data/tracker-state.json node_modules package.json package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_776E86B2EB894D47A8A9F1C4AE8F2312 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_817644FA648B4A229998E05734A25917 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BA340EF33D824A8EABC120D5C6C88902 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'serenity-tracker-994ac2'
          slot-name: 'Production'
          package: release.zip
          
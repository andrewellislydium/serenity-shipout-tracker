  <nav id="tabs" class="tabs noprint">
    <button class="tab on" data-view="schedule">Schedule<span class="lg"> dashboard</span></button>
    <button class="tab" data-view="tasks">Tasks</button>
    <button class="tab" data-view="daily">Daily<span class="lg"> goals</span></button>
    <span class="tab-sp"></span>
    <button class="btn ghost" id="btnExport">Export backup</button>
    <button class="btn ghost" id="btnImport">Import backup</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </nav>

  <section id="view-schedule" class="view">
    <div class="vtools noprint">
      <button class="btn" id="btnPrintSched">Print schedule</button>
      <button class="btn ghost" id="btnDlSched">Download schedule (HTML)</button>
    </div>
    <div id="schedule"></div>
  </section>

  <section id="view-tasks" class="view" hidden>
    <div class="vtools noprint">
      <button class="btn pri" id="btnAdd">Add task</button>
      <select id="fStage"><option value="">All stages</option></select>
      <select id="fStatus"><option value="">All statuses</option><option value="todo">Not started</option><option value="doing">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select>
      <label class="chk"><input type="checkbox" id="fDaily"> On daily summary only</label>
      <label class="chk"><input type="checkbox" id="fHideDone"> Hide done</label>
    </div>
    <div id="tasks"></div>
  </section>

  <section id="view-daily" class="view" hidden>
    <div class="vtools dtools noprint">
      <button class="btn" id="dPrev" aria-label="Previous day">&larr; Previous</button>
      <input type="date" id="dDate">
      <button class="btn" id="dNext" aria-label="Next day">Next &rarr;</button>
      <button class="btn ghost" id="dToday">Today</button>
      <span class="tab-sp"></span>
      <button class="btn pri" id="btnPrintDaily">Print daily sheet</button>
      <button class="btn ghost" id="btnDlDaily">Download sheet (HTML)</button>
    </div>
    <p class="hint noprint" id="dHint">Tap a box to tick a goal off. Changes save automatically.</p>
    <div id="sheet"></div>
  </section>
  <div class="backup-m noprint"><button class="btn ghost" id="btnExportM">Export backup</button><button class="btn ghost" id="btnImportM">Import backup</button></div>
</div>

<dialog id="dlg">
  <div class="dlg-box">
    <div class="dlg-title" id="dlgTitle">Task</div>
    <div class="fgrid">
      <label class="f full"><span>Task</span><input type="text" id="fTitle" maxlength="200"></label>
      <label class="f"><span>Stage</span><select id="fStageSel"></select></label>

/* ---------------- date helpers ---------------- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d, 12, 0, 0); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoOf(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayISO = () => isoOf(new Date());
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDow = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${DOWFULL[d.getDay()]} ${d.getDate()} ${MONFULL[d.getMonth()]} ${d.getFullYear()}`; };
const fmtRange = (a, b) => a === b ? fmtShort(a) : `${fmtShort(a)} – ${fmtShort(b)}`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const stageIdx = id => Math.max(0, STAGES.findIndex(s => s.id === id));

/* ---------------- state + storage ---------------- */
let state = { ship: '2026-10-28', tasks: [], notes: {} };
let view = 'schedule';
let dailyDate = todayISO();
let canWrite = true;
let storeMode = 'init';      // 'db' | 'local' | 'init'
let ref = null, saveTimer = null, saving = false, dirty = false, lastErr = '';
const LS_KEY = 'lydium-serenity-shipout-tracker';

function normalize(d) {
  const out = { ship: (d && d.ship) || '2026-10-28', tasks: [], notes: {} };
  if (d && d.notes && typeof d.notes === 'object') Object.keys(d.notes).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof d.notes[k] === 'string' && d.notes[k].trim()) out.notes[k] = d.notes[k].slice(0, 2000); });
  if (d && Array.isArray(d.tasks)) {
    out.tasks = d.tasks.filter(t => t && t.id && t.start && t.end).map(t => ({
      id: String(t.id), stage: STAGES.some(s => s.id === t.stage) ? t.stage : '3A', title: String(t.title || 'Untitled'),
      start: t.start, end: t.end < t.start ? t.start : t.end, owner: t.owner || '', status: STATUS[t.status] ? t.status : 'todo',
      daily: !!t.daily, notes: t.notes || '', doneAt: t.doneAt || ''
    }));
  }
  return out;
}

function setSync(text, cls) { const e = document.getElementById('syncState'); e.textContent = text; e.className = 'sync ' + (cls || ''); }

function scheduleSave() {
  if (!canWrite) return;
  dirty = true;
  if (storeMode === 'local') { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); setSync('Saved in this browser only', 'warn'); } catch (e) { setSync('Not saved', 'warn'); } dirty = false; return; }
  setSync('Saving', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}
async function flushSave() {
  if (!ref || saving) { if (saving) saveTimer = setTimeout(flushSave, 400); return; }
  saving = true; dirty = false;
  try {
    await ref.set({ ship: state.ship, tasks: state.tasks, notes: state.notes || {}, updated: new Date().toISOString() });
    setSync(dirty ? 'Saving' : 'Saved', 'ok');
  } catch (e) {
    lastErr = (e && e.code) || 'error';
    if (lastErr === 'invalid_argument') { canWrite = false; document.getElementById('app').classList.add('ro'); setSync('Read only', 'warn'); }
    else setSync('Not saved, retrying', 'warn');
    if (lastErr !== 'invalid_argument') { dirty = true; saveTimer = setTimeout(flushSave, 4000); }
  }
  saving = false;
  if (dirty && canWrite) { clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 500); }
}

async function initStore() {
  let db = null, user = null;
  try { if (typeof claude !== 'undefined') { db = await claude.use('db'); user = await claude.use('user'); } } catch (e) { db = null; }
  if (db) {
    storeMode = 'db';
    try { const w = user ? await user.can('data.write') : null; if (w === false) { canWrite = false; } } catch (e) {}
    if (!canWrite) { document.getElementById('app').classList.add('ro'); document.getElementById('dHint').textContent = 'View only. You can read this sheet but not tick goals off.'; }
    ref = db.doc('tracker/state');
    setSync(canWrite ? 'Connecting' : 'View only', canWrite ? '' : 'warn');
    ref.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (dirty || saving) return;
      if (snap.exists) { state = normalize(snap.data()); }
      else { state = { ship: '2026-10-28', tasks: [], notes: {} }; }
      setSync(canWrite ? 'Saved' : 'View only', canWrite ? 'ok' : 'warn');
      renderAll();
    }, err => { setSync('Disconnected', 'warn'); });
  } else {
    storeMode = 'local';
    try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}
    setSync('Saved in this browser only', 'warn');
    renderAll();
  }
}

/* ---------------- derived data ---------------- */
function statusClass(t, today) { return t.status; }
function isOverdue(t, today) { return t.status !== 'done' && t.end < today; }
function sortTasks(a, b) { return stageIdx(a.stage) - stageIdx(b.stage) || a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || a.title.localeCompare(b.title); }

function metrics() {
  const T = state.tasks, today = todayISO();
  const done = T.filter(t => t.status === 'done').length;
  return {
    today, total: T.length, done,
    doing: T.filter(t => t.status === 'doing').length,
    blocked: T.filter(t => t.status === 'blocked').length,
    overdue: T.filter(t => isOverdue(t, today)).length,
    afterShip: T.filter(t => t.status !== 'done' && t.end > state.ship).length,
    toShip: diffDays(today, state.ship),
    pct: T.length ? Math.round(done / T.length * 100) : 0,
  };
}

function dailyGoals(D) {
  const f = state.tasks.filter(t => t.daily);
  const today = f.filter(t => t.start <= D && D <= t.end && (t.status !== 'done' || t.doneAt === D)).sort(sortTasks);
  const carried = f.filter(t => t.end < D && t.status !== 'done').sort(sortTasks);
  const tomorrow = f.filter(t => t.start === addDays(D, 1) && t.status !== 'done').sort(sortTasks);
  const doneY = state.tasks.filter(t => t.status === 'done' && t.doneAt === addDays(D, -1)).sort(sortTasks);
  return { today, carried, tomorrow, doneY };
}

/* ---------------- renderers (return HTML strings) ---------------- */
function progBar(list) {
  const n = list.length || 1, c = k => list.filter(t => t.status === k).length;
  return `<div class="bar-prog" title="${c('done')} done, ${c('doing')} in progress, ${c('blocked')} blocked, ${c('todo')} not started">
    <i style="width:${c('done')/n*100}%;background:#731F60"></i><i style="width:${c('doing')/n*100}%;background:#C6168D"></i><i style="width:${c('blocked')/n*100}%;background:#A36B37"></i></div>`;
}
function chip(stageId) { const s = stageOf(stageId); return `<span class="chip" style="background:${s.color};color:${s.ink}">${s.id}</span>`; }

function renderScheduleHTML(interactive) {
  const m = metrics(), T = state.tasks.slice().sort(sortTasks), today = m.today;
  let h = '';
  const toShipTxt = m.toShip > 0 ? m.toShip : (m.toShip === 0 ? 'Today' : 'Passed');
  h += `<div class="kpis">
    <div class="kpi gold"><div class="n">${toShipTxt}</div><div class="l">${m.toShip > 0 ? 'Days to ship (' + fmtShort(state.ship) + ')' : 'Ship date ' + fmtShort(state.ship)}</div></div>
    <div class="kpi"><div class="n">${m.done}/${m.total}</div><div class="l">Tasks done (${m.pct}%)</div></div>
    <div class="kpi"><div class="n">${m.doing}</div><div class="l">In progress</div></div>
    <div class="kpi ${m.overdue ? 'warn' : ''}"><div class="n">${m.overdue}</div><div class="l">Overdue</div></div>
    <div class="kpi ${m.blocked ? 'warn' : ''}"><div class="n">${m.blocked}</div><div class="l">Blocked</div></div>
    <div class="kpi ${m.afterShip ? 'warn' : ''}"><div class="n">${m.afterShip}</div><div class="l">Scheduled after ship date</div></div>
  </div>`;

  h += `<div class="sec-t">Progress by stage</div>`;
  STAGES.forEach(s => {
    const L = T.filter(t => t.stage === s.id), d = L.filter(t => t.status === 'done').length;
    const span = L.length ? fmtRange(L.reduce((a, t) => t.start < a ? t.start : a, L[0].start), L.reduce((a, t) => t.end > a ? t.end : a, L[0].end)) : 'No tasks';
    h += `<div class="stg"><div>${chip(s.id)} <span class="stg-n">${esc(s.name)}</span></div>${progBar(L)}<div class="stg-c">${d}/${L.length} done · ${span}</div></div>`;
  });

  // attention list
  const att = [];
  T.forEach(t => {
    if (t.status === 'done') return;
    if (isOverdue(t, today)) att.push(['over', 'Overdue', t, `was due ${fmtShort(t.end)}`]);
    else if (t.status === 'blocked') att.push(['blk', 'Blocked', t, fmtRange(t.start, t.end)]);
    else if (t.end === today) att.push(['due', 'Due today', t, fmtRange(t.start, t.end)]);
    else if (t.status === 'todo' && t.start < today) att.push(['ns', 'Not started', t, `should have started ${fmtShort(t.start)}`]);
    if (t.end > state.ship) att.push(['ship', 'After ship date', t, `ends ${fmtShort(t.end)}`]);
  });
  h += `<div class="sec-t">Needs attention</div>`;
  if (!att.length) h += `<div class="empty">Nothing overdue, blocked or due today.</div>`;
  else h += '<ul class="att">' + att.map(a => `<li><span class="tag ${a[0]}">${a[1]}</span>${chip(a[2].stage)} ${interactive ? `<button class="lnk" data-open="${esc(a[2].id)}">${esc(a[2].title)}</button>` : `<span>${esc(a[2].title)}</span>`}<span class="dt">${a[3]}</span></li>`).join('') + '</ul>';

  // gantt
  h += `<div class="sec-t">Schedule</div>`;
  if (!T.length) { h += `<div class="empty">No tasks yet. Add the first one on the Tasks tab.</div>`; return h; }
  let start = T.reduce((a, t) => t.start < a ? t.start : a, T[0].start);
  let end = T.reduce((a, t) => t.end > a ? t.end : a, state.ship);
  if (today < start && diffDays(today, start) <= 3) start = today;
  end = addDays(end, 1);
  const N = diffDays(start, end) + 1, dw = 100 / N, days = [];
  for (let i = 0; i < N; i++) days.push(addDays(start, i));
  h += `<div class="g">`;
  // month header
  h += '<div class="g-head">'; let cur = null, cnt = 0, parts = [];
  days.forEach(d => { const k = d.slice(0, 7); if (k !== cur) { if (cur) parts.push([cur, cnt]); cur = k; cnt = 1; } else cnt++; });
  parts.push([cur, cnt]);
  parts.forEach(p => { const mo = Number(p[0].slice(5, 7)) - 1; h += `<div class="g-mo" style="flex:${p[1]}">${MONFULL[mo]} ${p[0].slice(0, 4)}</div>`; });
  h += '</div><div class="g-days">';
  days.forEach(d => { const dt = parse(d), we = dt.getDay() === 0 || dt.getDay() === 6; h += `<div class="g-d${we ? ' we' : ''}${d === today ? ' td' : ''}">${DOW[dt.getDay()][0]}<b>${dt.getDate()}</b></div>`; });
  h += '</div><div class="g-body"><div class="g-over">';
  days.forEach((d, i) => { const dt = parse(d), we = dt.getDay() === 0 || dt.getDay() === 6;
    if (we) h += `<i class="we" style="left:${i * dw}%;width:${dw}%"></i>`;
    if (d === today) h += `<i class="td" style="left:${i * dw}%;width:${dw}%"></i>`;
    if (d === state.ship) h += `<i class="shp" style="left:${i * dw}%;width:${dw}%"></i>`; });
  h += '</div>';
  const si = diffDays(start, state.ship);
  if (si >= 0 && si < N) h += `<div class="g-ship-lab" style="left:calc(var(--lw) + (100% - var(--lw)) * ${(si + 1) / N})">Ship out</div>`;
  STAGES.forEach(s => {
    const L = T.filter(t => t.stage === s.id); if (!L.length) return;
    h += `<div class="g-grp">${chip(s.id)} ${esc(s.name)} <small>${L.filter(t => t.status === 'done').length}/${L.length} done</small></div>`;
    L.forEach(t => {
      const i0 = diffDays(start, t.start), i1 = diffDays(start, t.end), span = i1 - i0 + 1;
      const lab = interactive ? `<button data-open="${esc(t.id)}">${esc(t.title)}</button>` : `<span style="font-weight:600">${esc(t.title)}</span>`;
      const txt = span >= 2 ? STATUS[t.status] : '';
      h += `<div class="g-row"><div class="g-lab">${lab}<small>${esc(t.owner || 'Unassigned')} · ${fmtRange(t.start, t.end)}</small></div>
        <div class="g-track"><${interactive ? 'button' : 'div'} class="g-bar ${t.status}${isOverdue(t, today) || t.end > state.ship ? ' late' : ''}" ${interactive ? `data-open="${esc(t.id)}"` : ''} style="left:calc(${i0 * dw}% + 1px);width:calc(${span * dw}% - 2px)" title="${esc(t.title)}: ${fmtRange(t.start, t.end)}, ${STATUS[t.status]}">${txt}</${interactive ? 'button' : 'div'}></div></div>`;
    });
  });
  h += `</div></div>
  <div class="leg"><span><i style="background:#731F60"></i>Done</span><span><i style="background:#C6168D"></i>In progress</span><span><i style="background:#F0D3E6;border-color:#C6168D"></i>Not started</span><span><i style="background:#A36B37"></i>Blocked</span><span><i style="background:#fff;box-shadow:0 0 0 2px #FDB913"></i>Gold outline: overdue or after ship date</span><span><i style="background:rgba(253,185,19,.4)"></i>Today</span><span><i style="border-right:2px dashed #731F60;background:#fff"></i>Ship date</span></div>`;
  return h;
}

function renderSheetHTML(D) {
  const g = dailyGoals(D), m = metrics();
  const toShip = diffDays(D, state.ship);
  const bigTxt = toShip > 0 ? `${toShip}` : (toShip === 0 ? 'Ship day' : 'Shipped');
  const smTxt = toShip > 0 ? `day${toShip === 1 ? '' : 's'} to ship-out` : `Ship out ${fmtDow(state.ship)}`;
  let h = `<div class="sheet"><div class="sh-top"><div><div class="sh-eyebrow">Serenity Power · Ship-out readiness · Global Controls, Calgary</div><div class="sh-title">Daily goals</div><div class="sh-date">${fmtLong(D)}</div></div>
    <div class="sh-ship"><div class="big">${bigTxt}</div><div class="sm">${smTxt}</div>${toShip > 0 ? `<div class="sm">Target ${fmtDow(state.ship)}</div>` : ''}</div></div>`;
  h += '<div class="sh-prog">' + STAGES.map(s => { const L = state.tasks.filter(t => t.stage === s.id); const d = L.filter(t => t.status === 'done').length; return `<div>${chip(s.id)} <b>${esc(s.name)}</b>${d}/${L.length} done${progBar(L).replace('class="bar-prog"', 'class="bar-prog bp"')}</div>`; }).join('') + '</div>';

  const row = (t, interactive) => {
    const done = t.status === 'done';
    return `<tr><td class="cbc"><span class="cb${done ? ' on' : ''}" data-id="${esc(t.id)}" ${interactive ? `data-toggle="${esc(t.id)}" role="checkbox" aria-checked="${done}" tabindex="0"` : ''}></span></td>
      <td><div class="g-t${done ? ' dn' : ''}">${chip(t.stage)} ${esc(t.title)}</div>${t.notes ? `<div class="g-n">${esc(t.notes)}</div>` : ''}</td>
      <td class="g-m">${esc(t.owner || '')}${t.owner ? '<br>' : ''}${t.status === 'blocked' ? '<b>Blocked</b> · ' : ''}${fmtRange(t.start, t.end)}</td></tr>`;
  };
  const section = (title, list, interactive, emptyTxt) => `<div class="sh-h">${title}</div>` + (list.length ? `<table class="gl">${list.map(t => row(t, interactive)).join('')}</table>` : `<div class="sh-none">${emptyTxt}</div>`);
  return { head: h, row, section, g };
}
const LINES = '<div class="sh-lines"><i></i><i></i><i></i><i></i></div>';
function notesPrinted(txt) { return txt && txt.trim() ? `<div class="notes-text">${esc(txt)}</div>` : LINES; }
function notesHTML(D, interactive) {
  const txt = (state.notes && state.notes[D]) || '';
  if (!interactive) return `<div class="sh-h">Notes and blockers</div>${notesPrinted(txt)}`;
  return `<div class="sh-h">Notes and blockers</div><textarea id="notesBox" class="notes-box noprint" data-notes="${D}" rows="5" maxlength="2000" aria-label="Notes and blockers" placeholder="Type notes and blockers for ${fmtShort(D)}. They save with the sheet and appear in the downloaded file." ${canWrite ? '' : 'readonly'}>${esc(txt)}</textarea><div id="notesPrint" class="notes-print">${notesPrinted(txt)}</div>`;
}
function sheetBody(D, interactive) {
  const r = renderSheetHTML(D), g = r.g;
  let h = r.head;
  if (g.carried.length) h += r.section('Carried over, not yet done', g.carried, interactive, '');
  h += r.section('Goals for today', g.today, interactive, 'No tasks are flagged for today. Tick "Include on the daily summary" on a task to add it.');
  if (g.tomorrow.length) h += r.section('Starting tomorrow', g.tomorrow, interactive, '');
  if (g.doneY.length) h += r.section('Completed yesterday', g.doneY, interactive, '');
  h += notesHTML(D, interactive);
  h += `<div class="sh-foot"><span>Serenity Power / Ship-out readiness / ${fmtShort(D)}</span><span class="by"><span>Prepared by</span><img alt="Lydium" src="${LOGO}"></span></div></div>`;
  return h;
}

function renderTasksHTML() {
  const fs = document.getElementById('fStage').value, fst = document.getElementById('fStatus').value;
  const fd = document.getElementById('fDaily').checked, fh = document.getElementById('fHideDone').checked, today = todayISO();
  let T = state.tasks.slice().sort(sortTasks).filter(t => (!fs || t.stage === fs) && (!fst || t.status === fst) && (!fd || t.daily) && (!fh || t.status !== 'done'));
  if (!state.tasks.length) return `<div class="empty">No tasks yet. Use "Add task" to create the first one.</div>`;
  if (!T.length) return `<div class="empty">No tasks match these filters.</div>`;
  let h = `<table class="tt"><thead><tr><th>Done</th><th>Task</th><th>Dates</th><th>Owner</th><th>Status</th><th>Daily</th><th></th></tr></thead><tbody>`;
  let last = '';
  T.forEach(t => {
    if (t.stage !== last) { last = t.stage; const s = stageOf(t.stage); h += `<tr class="grp"><td colspan="7">${chip(s.id)} ${esc(s.name)}</td></tr>`; }
    const od = isOverdue(t, today);
    h += `<tr class="${t.status === 'done' ? 'isdone' : ''}"><td><input type="checkbox" class="edit-only-dis" data-done="${esc(t.id)}" ${t.status === 'done' ? 'checked' : ''} aria-label="Done"></td>
      <td><div class="ttl">${esc(t.title)}</div>${t.notes ? `<div class="note">${esc(t.notes)}</div>` : ''}</td>
      <td class="dts">${fmtRange(t.start, t.end)}${od ? ' <span class="pill blocked">Overdue</span>' : ''}</td><td>${esc(t.owner)}</td>
      <td><select data-status="${esc(t.id)}" aria-label="Status">${Object.keys(STATUS).map(k => `<option value="${k}"${k === t.status ? ' selected' : ''}>${STATUS[k]}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-daily="${esc(t.id)}" ${t.daily ? 'checked' : ''} aria-label="On daily summary"></td>
      <td class="dts"><button class="btn sm" data-open="${esc(t.id)}">Edit</button></td></tr>`;
  });
  return h + '</tbody></table>';
}

/* ---------------- render + events ---------------- */
function renderAll() {
  document.getElementById('shipDate').value = state.ship;
  const fs = document.getElementById('fStage');
  if (fs.options.length === 1) STAGES.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = `${s.id} · ${s.name}`; fs.appendChild(o); });
  document.getElementById('schedule').innerHTML = renderScheduleHTML(true);
  document.getElementById('tasks').innerHTML = renderTasksHTML();
  document.getElementById('dDate').value = dailyDate;
  const typing = document.activeElement && document.activeElement.id === 'notesBox';
  if (!typing) document.getElementById('sheet').innerHTML = sheetBody(dailyDate, true);
  if (!canWrite) document.querySelectorAll('[data-done],[data-status],[data-daily]').forEach(e => e.disabled = true);
}
function setView(v) {
  view = v;
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  document.querySelectorAll('.view').forEach(e => e.hidden = e.id !== 'view-' + v);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
}
function findTask(id) { return state.tasks.find(t => t.id === id); }
function mutate(fn) { if (!canWrite) return; fn(); scheduleSave(); renderAll(); }
function setStatus(t, st) { t.status = st; t.doneAt = st === 'done' ? todayISO() : ''; }

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
['fStage', 'fStatus', 'fDaily', 'fHideDone'].forEach(id => document.getElementById(id).addEventListener('change', () => { document.getElementById('tasks').innerHTML = renderTasksHTML(); if (!canWrite) document.querySelectorAll('[data-done],[data-status],[data-daily]').forEach(e => e.disabled = true); }));
document.getElementById('shipDate').addEventListener('change', e => { if (e.target.value) mutate(() => { state.ship = e.target.value; }); });

document.getElementById('app').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { openDlg(o.dataset.open); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg && canWrite) { const t = findTask(tg.dataset.toggle); if (t) mutate(() => setStatus(t, t.status === 'done' ? 'doing' : 'done')); }
});
document.getElementById('app').addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.matches('[data-toggle]')) { e.preventDefault(); e.target.click(); } });
document.getElementById('app').addEventListener('change', e => {
  const t0 = e.target;
  if (t0.dataset.done) { const t = findTask(t0.dataset.done); if (t) mutate(() => setStatus(t, t0.checked ? 'done' : 'doing')); }
  else if (t0.dataset.status) { const t = findTask(t0.dataset.status); if (t) mutate(() => setStatus(t, t0.value)); }
  else if (t0.dataset.daily) { const t = findTask(t0.dataset.daily); if (t) mutate(() => { t.daily = t0.checked; }); }
});

/* notes: save as you type */
document.getElementById('app').addEventListener('input', e => {
  if (e.target.id !== 'notesBox' || !canWrite) return;
  const D = e.target.dataset.notes, v = e.target.value;
  if (!state.notes) state.notes = {};
  if (v.trim()) state.notes[D] = v; else delete state.notes[D];
  scheduleSave();
  const np = document.getElementById('notesPrint'); if (np) np.innerHTML = notesPrinted(v);
});

/* daily controls */
const dd = document.getElementById('dDate');
dd.addEventListener('change', () => { if (dd.value) { dailyDate = dd.value; renderAll(); } });
document.getElementById('dPrev').onclick = () => { dailyDate = addDays(dailyDate, -1); renderAll(); };
document.getElementById('dNext').onclick = () => { dailyDate = addDays(dailyDate, 1); renderAll(); };
document.getElementById('dToday').onclick = () => { dailyDate = todayISO(); renderAll(); };

/* task dialog */
const dlg = document.getElementById('dlg');
let editingId = null;
function openDlg(id) {
  editingId = id || null;
  const t = id ? findTask(id) : null;
  const sel = document.getElementById('fStageSel');
  if (!sel.options.length) STAGES.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = `${s.id} · ${s.name}`; sel.appendChild(o); });
  const today = todayISO();
  document.getElementById('dlgTitle').textContent = t ? 'Edit task' : 'Add task';
  document.getElementById('fTitle').value = t ? t.title : '';
  sel.value = t ? t.stage : (document.getElementById('fStage').value || '3A');
  document.getElementById('fStatusSel').value = t ? t.status : 'todo';
  document.getElementById('fStart').value = t ? t.start : today;
  document.getElementById('fEnd').value = t ? t.end : today;
  document.getElementById('fOwner').value = t ? t.owner : '';
  document.getElementById('fNotes').value = t ? t.notes : '';
  document.getElementById('fOnDaily').checked = t ? t.daily : true;
  document.getElementById('dlgErr').textContent = '';
  document.getElementById('dlgDelete').style.display = t && canWrite ? '' : 'none';
  document.getElementById('dlgSave').style.display = canWrite ? '' : 'none';
  dlg.querySelectorAll('input,select,textarea').forEach(e => e.disabled = !canWrite);
  if (!dlg.open) dlg.showModal();
  document.getElementById('fTitle').focus();
}
document.getElementById('btnAdd').onclick = () => openDlg(null);
document.getElementById('dlgCancel').onclick = () => dlg.close();
document.getElementById('dlgSave').onclick = () => {
  const title = document.getElementById('fTitle').value.trim(), s = document.getElementById('fStart').value, e = document.getElementById('fEnd').value, err = document.getElementById('dlgErr');
  if (!title) { err.textContent = 'Give the task a name.'; return; }
  if (!s || !e) { err.textContent = 'Set a start and an end date.'; return; }
  if (e < s) { err.textContent = 'The end date is before the start date.'; return; }
  const st = document.getElementById('fStatusSel').value;
  mutate(() => {
    let t = editingId ? findTask(editingId) : null;
    if (!t) { t = { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), doneAt: '' }; state.tasks.push(t); }
    t.title = title; t.stage = document.getElementById('fStageSel').value; t.start = s; t.end = e;
    t.owner = document.getElementById('fOwner').value.trim(); t.notes = document.getElementById('fNotes').value.trim();
    t.daily = document.getElementById('fOnDaily').checked;
    if (st !== t.status || !t.status) setStatus(t, st);
  });
  dlg.close();
};
document.getElementById('dlgDelete').onclick = () => {
  if (!editingId || !confirm('Delete this task?')) return;
  mutate(() => { state.tasks = state.tasks.filter(t => t.id !== editingId); });
  dlg.close();
};

/* files: downloads capability, with a plain link fallback */
async function saveFile(name, mime, text) {
  try {
    if (typeof claude !== 'undefined') { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: new Blob([text], { type: mime }) }); return; } }
  } catch (e) { if (e && e.code === 'cancelled') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function standalone(title, inner, extra, isStatic) {
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title><style>${CSS}.doc.static .cb{cursor:default}.doc.static .cb::before{display:none}</style></head><body><div class="doc${isStatic ? ' static' : ''}">${inner}</div>${extra || ''}</body></html>`;
}
function headerStatic(sub) {
  return `<header class="hdr"><div class="hdr-l"><div class="hdr-eyebrow">Serenity Power · Global Controls, Calgary</div><div class="hdr-title">Ship-out readiness tracker</div><div class="hdr-sub">${sub}</div></div>
  <div class="hdr-r"><div class="ship-box"><label>Target ship date</label><div class="ship-fixed">${fmtDow(state.ship)}</div><div class="ship-note">Target, pending Italgas proposal acceptance</div></div><div class="hdr-meta"><img class="hdr-logo" alt="Lydium" src="${LOGO}"></div></div></header>`;
}
document.getElementById('btnDlSched').onclick = () => saveFile(`Serenity_shipout_schedule_${todayISO()}.html`, 'text/html', standalone('Ship-out schedule', headerStatic(`Schedule status as of ${fmtLong(todayISO())}`) + `<div class="view">${renderScheduleHTML(false)}</div>`));
function tickScript(date) {
  return `<script>(function(){var K='lydium-sheet-${date}',s={};try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
document.querySelectorAll('.cb[data-id]').forEach(function(c){var id=c.getAttribute('data-id');
function paint(){var on=c.classList.contains('on');c.setAttribute('aria-checked',on);var t=c.closest('tr').querySelector('.g-t');if(t)t.classList.toggle('dn',on);}
if(s[id]!==undefined)c.classList.toggle('on',!!s[id]);
c.setAttribute('role','checkbox');c.tabIndex=0;paint();
function tog(){c.classList.toggle('on');s[id]=c.classList.contains('on');try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}paint();}
c.addEventListener('click',tog);c.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();tog();}});});})();<\/script>`;
}
document.getElementById('btnDlDaily').onclick = () => saveFile(`Serenity_daily_goals_${dailyDate}.html`, 'text/html', standalone('Daily goals ' + dailyDate, `<div style="padding:14px 12px 0"><p class="sh-note noprint">Tap a box to tick a goal off. Ticks are remembered in this browser on this device.</p>${sheetBody(dailyDate, false)}</div>`, tickScript(dailyDate), false));
document.getElementById('btnExport').onclick = () => saveFile(`Serenity_shipout_tracker_backup_${todayISO()}.json`, 'application/json', JSON.stringify({ ship: state.ship, tasks: state.tasks, notes: state.notes || {} }, null, 2));
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('btnExportM').onclick = () => document.getElementById('btnExport').click();
document.getElementById('btnImportM').onclick = () => document.getElementById('btnImport').click();
document.getElementById('fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = normalize(JSON.parse(r.result)); if (confirm(`Replace the current tasks with ${d.tasks.length} tasks from this backup?`)) mutate(() => { state = d; }); } catch (x) { alert('That file could not be read as a tracker backup.'); } };
  r.readAsText(f); e.target.value = '';
});

/* printing */
function doPrint(kind, orient) {
  const st = document.createElement('style'); st.id = 'pg';
  st.textContent = `@page{size:${orient};margin:${kind === 'daily' ? '12mm' : '10mm'}}`;
  document.head.appendChild(st); document.body.classList.add('print-' + kind);
  const done = () => { document.body.classList.remove('print-' + kind); st.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  try { window.print(); } catch (e) { done(); alert('Printing is blocked here. Use "Download" and print the downloaded file.'); }
}
document.getElementById('btnPrintDaily').onclick = () => doPrint('daily', 'portrait');
document.getElementById('btnPrintSched').onclick = () => doPrint('schedule', 'landscape');

function initialView() {
  const h = (location.hash || '').replace('#', '');
  if (['schedule', 'tasks', 'daily'].includes(h)) return h;
  try { if (window.matchMedia('(max-width: 760px)').matches) return 'daily'; } catch (e) {}
  return 'schedule';
}
setView(initialView());
renderAll();
initStore();
</script>
</body>
